<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeTrack - Iniciar Sesión</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <header>
    <h1><i class="fa-solid fa-mug-saucer" style="color: #ffffff;"></i> CoffeeTrack</h1>
    <nav></nav>
  </header>

  <main>
    <section class="welcome">
      <h1>Bienvenido</h1>
      <p>Disfruta de las mejores bebidas y un ambiente acogedor mientras gestionas tus pedidos e inventario de manera
        eficiente.</p>
    </section>

    <div class="login-box">
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>

        <label for="password">Contraseña</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="••••••••" minlength="8" required
            title="La contraseña debe tener al menos 8 caracteres.">
          <span class="toggle-password" id="togglePassword">👁️</span>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="contacto">
      <h3>Contacto</h3>
      <p>Teléfono: <a href="tel:+528672451636">+52 867 789 2930</a></p>
      <p>Correo: <a
          href="https://mail.google.com/mail/?view=cm&fs=1&to=cafeteriajav4@gmail.com">coffeetrack@gmail.com</a></p>
    </div>

    <div class="social">
      <h3>Redes sociales</h3>
      <div class="icons">
        <a href="https://twitter.com/" title="Twitter">
          <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="Twitter" width="24" height="24">
        </a>
        <a href="https://facebook.com/" title="Facebook">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook" width="24" height="24">
        </a>
        <a href="https://instagram.com/" title="Instagram">
          <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" width="24" height="24">
        </a>
      </div>
    </div>
  </footer>

  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.textContent = isPassword ? '👁️‍🗨️' : '👁️';
    });
  </script>
  <script src="/assets/js/auth.js"></script>

</body>

</html>
